name: comparedge
displayName: ComparEdge Software Intelligence
description: Query verified pricing, aggregated ratings, feature comparisons, and category rankings for 495+ SaaS, AI, and security tools. Updated daily with full changelog history. No API key required.
homepage: https://comparedge.com/mcp
license: MIT
runtime: node
version: "2.7.1"

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@comparedge/mcp-server@latest"]
    })

tools:
  - name: search_tools
    description: Search 495+ software products by name or keyword
  - name: get_tool
    description: Full pricing plans and feature details for a specific tool
  - name: compare_tools
    description: Side-by-side comparison of two software products
  - name: list_category
    description: Browse all tools in a category with pricing overview
  - name: get_alternatives
    description: Top alternatives to a given software tool
  - name: get_pricing
    description: Complete pricing breakdown with verified plan data
  - name: get_leaderboard
    description: Top-rated tools by category, ranked by aggregated review scores
  - name: list_categories
    description: List all 44 supported software categories
