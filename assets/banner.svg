<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="340" viewBox="0 0 1160 340" role="img" aria-label="comparedge: verified SaaS pricing for AI assistants">
  <rect width="1160" height="340" rx="18" fill="#131722"/>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-weight="bold" font-size="76" fill="none" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round">
    <text x="56"  y="104" stroke="#f59e0b">c</text>
    <text x="103" y="104" stroke="#f97316">o</text>
    <text x="150" y="104" stroke="#ef4444">m</text>
    <text x="197" y="104" stroke="#ec4899">p</text>
    <text x="244" y="104" stroke="#d946ef">a</text>
    <text x="291" y="104" stroke="#a855f7">r</text>
    <text x="338" y="104" stroke="#8b5cf6">e</text>
    <text x="385" y="104" stroke="#6366f1">d</text>
    <text x="432" y="104" stroke="#3b82f6">g</text>
    <text x="479" y="104" stroke="#06b6d4">e</text>
  </g>
  <text x="58" y="146" font-family="Menlo, Consolas, monospace" font-size="20" fill="#9aa4b2">verified SaaS pricing for AI assistants</text>
  <g font-family="Menlo, Consolas, monospace" font-size="19">
    <text x="640" y="76"  fill="#22c55e">- - - - - - - - - - - - - - - -</text>
    <text x="640" y="116" fill="#22c55e">Products  <tspan fill="#e5e7eb">494 · 44 categories</tspan></text>
    <text x="640" y="150" fill="#22c55e">Tools     <tspan fill="#e5e7eb">8 enabled</tspan></text>
    <text x="640" y="184" fill="#22c55e">Prices    <tspan fill="#e5e7eb">traced to vendors</tspan></text>
    <text x="640" y="224" fill="#22c55e">- - - - - - - - - - - - - - - -</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="24">
    <text x="58" y="262" fill="#22c55e">comparedge &gt;</text>
    <g clip-path="url(#type1)">
      <text x="238" y="262" fill="#e5e7eb">compare_tools notion coda</text>
    </g>
    <clipPath id="type1">
      <rect x="238" y="236" width="0" height="36">
        <animate attributeName="width" from="0" to="378" dur="2.2s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </g>
  <text x="58" y="304" font-family="Menlo, Consolas, monospace" font-size="19" fill="#6b7280">
    <tspan opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3s" fill="freeze"/>side by side: pricing, ratings, free plans, verified July 2026</tspan>
  </text>
  <rect x="622" y="238" width="15" height="28" fill="#e5e7eb">
    <animate attributeName="x" from="244" to="622" dur="2.2s" begin="0.6s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="2.9s" repeatCount="indefinite"/>
  </rect>
</svg>
